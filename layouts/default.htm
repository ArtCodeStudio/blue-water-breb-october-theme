<!DOCTYPE html>
<html>
    <head>
        {% partial 'html_head' %}
    </head>
    <body>
    
        {% partial 'navbar' %}
        {% partial 'blog/blog_header' %} 
        <div id="barba-wrapper">
            <div
                class="barba-container"
                id="{{ str_studly(this.page.title) | lower }}"
                data-namespace="{{ str_studly(this.page.title) | lower }}">
                <section id="layout-content">
                    <div class="container" id="default-layout-container">
                        {% page %}
                    </div>
                </section>
            </div>
        </div>
        
        {% partial 'footer/footer_brand' %}
        {% partial 'footer/footer_navigation' %}
        {% partial 'footer/footer_contact' %}
        {% partial 'footer/footer_legal' %}     
        {% partial 'body_foot' %}
                
    </body>
</html>
