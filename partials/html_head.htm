description = "Meta Tags"

[viewBag]
==
<meta charset="utf-8">
                        
<meta name="author" content="JumpLink">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no">
<meta http-equiv="x-ua-compatible" content="ie=edge">


<link rel="apple-touch-icon" sizes="180x180" href="{{'assets/favicons/apple-touch-icon.png' |theme}}">
<link rel="icon" type="image/png" href="{{'assets/favicons/favicon-32x32.png" sizes="32x32' |theme }}">
<link rel="icon" type="image/png" href="{{'assets/favicons/favicon-16x16.png" sizes="16x16' |theme }}">
<link rel="manifest" href="{{'/assets/favicons/manifest.json' | theme }}">
<link rel="mask-icon" href="{{'/assets/favicons/safari-pinned-tab.svg' | theme }}" color="#ef2a21">
<meta name="theme-color" content="#ffffff">


<meta name="theme-color" content="#1E88E5">
{% styles %}
{# assets/scss/theme.scss #}
<link href="{{'assets/css/theme.css' |theme }}" rel="stylesheet">

<link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/animate.css/3.2.0/animate.min.css">
