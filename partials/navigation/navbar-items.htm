[viewBag]
==
<ul class="{{ class }}">
    {% for item in items %}
        <li class="nav-item {{ item.isActive ? 'active' : '' }} {{ item.isChildActive ? 'child-active' : '' }} {{ item.viewBag.cssClass }} {{ item.items ? 'dropdown' : '' }}">

            {% if item.url %}
                <a href="{{ item.url }}{% if item.viewBag.cssClass %}#{{ item.viewBag.cssClass }}"{% endif %}" class="nav-link" {% if item.items %}data-toggle="dropdown"{% endif %} {{ item.viewBag.isExternal ? 'target="_blank"' }}>
                    {{ item.title }}
                    {% if item.items %}
                        <span class="caret"></span>
                    {% endif %}
                </a>
            {% else %}
                <span class="nav-link" {% if item.items %}data-toggle="dropdown"{% endif %}>{{ item.title }}</span>
            {% endif %}


            {% if item.items %}
                {% partial 'menu-items' items=item.items class='dropdown-menu' %}
            {% endif %}
        </li>
    {% endfor %}
</ul>
