[viewBag]
snippetCode = "overview"
snippetName = "Overview"
==
{#<div id="overview" data-target="#overview"> #}
<div id="overview" class="container text-xs-center p-y-3">

	<div class="row">
		<div class="card-group-flex">

			<div class="card col-xs-12 col-sm-6 p-x-0">
				<img class="m-x-auto p-b-2" src="{{'assets/images/icons/terminal_operations.svg'|theme}}">
				{# <h3 class="text-xs-center">{{mobiletitle}}</h3>#}
				<div class="card-block">
					<h3 class="text-xs-center text-serif">Terminal Operations</h3>            
					<div class='overview-content-container'>
						{% content 'overview/Terminal.htm'|raw %}
					</div>
					<div class="learn-more m-x-auto text-xs-center">
						<a href="/terminal" class="read-more m-r-1">read more</a>
						<a href="mailto:{{this.theme.terminal_email}}" class="btn btn-blue-outline m-l-1">contact</a>
					</div>
				</div>
			</div>
			
			<div class="card col-xs-12 col-sm-6 p-x-0">
				<img class="m-x-auto p-b-2" src="{{'assets/images/icons/portagency3.svg'|theme}}">
				<div class="card-block">
					<h3 class="text-xs-center text-serif">Port Agency</h3>
					<div class='overview-content-container'>
						{% content 'overview/PortAgency.htm' %}
					</div>
					<div class="learn-more m-x-auto text-xs-center">
						<a href="/port-agency" class="read-more m-r-1">read more</a>
						<a href="mailto:{{this.theme.portagency_email}}" class="btn btn-blue-outline m-l-1">contact</a>
					</div>
				</div>
			</div>

		</div>
	</div>

</div>
